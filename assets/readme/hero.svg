<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Appilot — 应用运营副驾</title>
  <desc id="desc">A warm, light mission-control illustration connecting evidence, decisions, and releases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FBF7EE"/><stop offset="1" stop-color="#F1E9DA"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#342B22" stroke-opacity=".045"/></pattern>
    <radialGradient id="glow"><stop stop-color="#F4BD58" stop-opacity=".38"/><stop offset="1" stop-color="#F4BD58" stop-opacity="0"/></radialGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#C9742B"/><stop offset="1" stop-color="#F4BD58"/></linearGradient>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/><rect width="1280" height="480" fill="url(#grid)"/>
  <line x1="512" y1="42" x2="512" y2="438" stroke="#342B22" stroke-opacity=".12"/>
  <circle cx="900" cy="244" r="270" fill="url(#glow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="54" y="62" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" font-weight="700" letter-spacing="2.4" fill="#A56C32">LOCAL-FIRST APP OPERATIONS</text>
    <text x="52" y="140" font-size="76" font-weight="850" letter-spacing="-2" fill="#2B2620">Appilot</text>
    <rect x="54" y="154" width="240" height="10" rx="5" fill="#F0B64E"/>
    <text x="54" y="211" font-size="28" font-weight="760" fill="#AC6328">应用运营副驾</text>
    <text x="54" y="247" font-size="25" font-weight="720" fill="#AC6328">Evidence-led. Release-ready.</text>
    <text x="54" y="293" font-size="17" fill="#685E52">把仓库、商店事实与行动放进同一个驾驶舱</text>
    <text x="54" y="322" font-size="16" fill="#807567">Turn product evidence into decisions you can ship.</text>
  </g>
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#74685A">
    <circle cx="64" cy="393" r="8" fill="#D47B31" stroke="#2B2620" stroke-width="2.5"/><text x="80" y="398">OBSERVE</text>
    <path d="M153 393h35m-8-6 8 6-8 6" fill="none" stroke="#2B2620" stroke-width="2"/>
    <circle cx="204" cy="393" r="8" fill="#E69A3A" stroke="#2B2620" stroke-width="2.5"/><text x="220" y="398">DECIDE</text>
    <path d="M285 393h35m-8-6 8 6-8 6" fill="none" stroke="#2B2620" stroke-width="2"/>
    <circle cx="336" cy="393" r="8" fill="#F1BC54" stroke="#2B2620" stroke-width="2.5"/><text x="352" y="398">SHIP</text>
  </g>
  <g transform="translate(565 54)">
    <rect x="0" y="0" width="650" height="372" rx="30" fill="#FFFDF7" stroke="#2B2620" stroke-width="3"/>
    <rect x="22" y="22" width="606" height="42" rx="12" fill="#312C28"/>
    <circle cx="46" cy="43" r="6" fill="#D97831"/><circle cx="67" cy="43" r="6" fill="#E8A448"/><circle cx="88" cy="43" r="6" fill="#F4C86A"/>
    <text x="326" y="49" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="2.2" fill="#F8EEDC">APPILOT / MISSION CONTROL</text>
    <rect x="22" y="82" width="180" height="108" rx="16" fill="#F6F0E4" stroke="#D6C8B5"/>
    <text x="40" y="108" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#9C6A39">SIGNALS</text>
    <path d="M42 164l31-24 28 8 32-35 42 18" fill="none" stroke="#D77A30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="73" cy="140" r="5" fill="#FFFDF7" stroke="#2B2620" stroke-width="2"/><circle cx="133" cy="113" r="5" fill="#FFFDF7" stroke="#2B2620" stroke-width="2"/>
    <rect x="222" y="82" width="190" height="108" rx="16" fill="#F6F0E4" stroke="#D6C8B5"/>
    <text x="240" y="108" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#9C6A39">COPILOT</text>
    <circle cx="267" cy="146" r="22" fill="#F2BC57" stroke="#2B2620" stroke-width="3"/><path d="M260 146l6 6 11-14" fill="none" stroke="#2B2620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="124" width="82" height="8" rx="4" fill="#C9BBA8"/><rect x="302" y="144" width="65" height="8" rx="4" fill="#DED3C4"/><rect x="302" y="164" width="46" height="8" rx="4" fill="#E8DFD2"/>
    <rect x="432" y="82" width="196" height="108" rx="16" fill="#312C28"/>
    <text x="450" y="108" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#F1BD58">RELEASE</text>
    <text x="450" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="800" fill="#FFF8EA">v1.2.0</text>
    <rect x="450" y="164" width="104" height="8" rx="4" fill="#F1BD58"/><circle cx="595" cy="148" r="17" fill="#54765A" stroke="#FFF8EA" stroke-width="2"/><path d="M587 148l6 6 10-13" fill="none" stroke="#FFF8EA" stroke-width="3"/>
    <rect x="22" y="210" width="606" height="140" rx="18" fill="#F6F0E4" stroke="#D6C8B5"/>
    <text x="42" y="239" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#9C6A39">EVIDENCE ROUTE</text>
    <path d="M65 296C166 240 214 322 306 278S459 244 574 285" fill="none" stroke="#D9A14D" stroke-opacity=".25" stroke-width="12" stroke-linecap="round"/>
    <path d="M65 296C166 240 214 322 306 278S459 244 574 285" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
    <g fill="#FFFDF7" stroke="#2B2620" stroke-width="2.5"><circle cx="65" cy="296" r="9"/><circle cx="201" cy="282" r="9"/><circle cx="306" cy="278" r="9"/><circle cx="445" cy="260" r="9"/><circle cx="574" cy="285" r="9"/></g>
    <g fill="#D77A30"><circle cx="65" cy="296" r="3"/><circle cx="201" cy="282" r="3"/><circle cx="306" cy="278" r="3"/><circle cx="445" cy="260" r="3"/><circle cx="574" cy="285" r="3"/></g>
  </g>
