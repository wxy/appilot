appId: xingyu.wang.appilot
productName: Appilot
copyright: Copyright © 2026 Xingyu Wang
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asar: true

# macOS: Developer ID signing happens automatically when CSC_LINK /
# CSC_KEY_PASSWORD are set; notarization is enabled in the release workflow
# via `-c.mac.notarize=true` (requires APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID), so local unsigned builds keep working without secrets.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # entitlements 位于 packaging/（源码配置，勿删）：build/ 是 electron-builder
  # 的 buildResources 目录，名字容易被当成构建临时产物清理掉（2026-09 实际误删过）。
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.inherit.plist
  extendInfo:
    NSAppleEventsUsageDescription: Appilot 使用 Keynote 生成多语言商店截图文稿。

dmg:
  title: Appilot ${version}
