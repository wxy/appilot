name: publish

# 发布 @appilot-labs/* 9 个包到 npm（不发布 desktop/CLI/profile 等）。
# 触发：手动（workflow_dispatch）或推送 v* tag。
# 认证：npmjs OIDC Trusted Publishing（无需长期 token）。

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "需要 bump 的包（可选，手动指定）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # OIDC trusted publishing 需 npm ≥ 11.5.1（Node 24 自带 npm 11）
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # 构建全部（core + plugins），发布内容依赖 dist
      - run: npm run build

      # 按依赖顺序发布（core → headless → common → project/release → dsh → cli/mcp）。
      # apps/desktop、packages/cli、profiles/ 不发布。
      - name: Publish @appilot-labs/appilot-core
        working-directory: packages/core
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-headless
        working-directory: packages/headless
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-common
        working-directory: plugins/dsh-common
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-project
        working-directory: plugins/dsh-project
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-release
        working-directory: plugins/dsh-release
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot (dsh 插件)
        working-directory: plugins/dsh-appilot
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-headless-cli
        working-directory: packages/headless-cli
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-scheduler
        working-directory: packages/scheduler
        run: npm publish --access public

      - name: Publish @appilot-labs/appilot-mcp
        working-directory: packages/mcp
        run: npm publish --access public

# OIDC Trusted Publishing（2026-09 流程，见 https://docs.npmjs.com/trusted-publishers/）：
# 1) npmjs.com → 每个包 Settings → Trusted Publisher → GitHub Actions：
#    Org/User=wxy · Repository=appilot · Workflow filename=publish.yml
#    Allowed actions 勾选「npm publish」（9/3 后默认仅 stage，需显式允许直接发布）
# 2) 本 workflow 已带 permissions: id-token: write + registry-url（Node 24/npm≥11.5.1）
# 3) OIDC 发布自动生成 provenance，无需配置 NODE_AUTH_TOKEN
