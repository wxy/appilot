name: CI

# PR 快速门禁（ubuntu + 一台 windows 轻量插件构建）。
# master push 的全量验证（含 macOS/Windows 平台构建）见 build.yml——
# 两者都不用 if 按事件过滤 job，避免 checks 里出现常驻 skip 的检查项。
# 注意：typecheck / test 两个 job 与 build.yml 保持同步。

on:
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      # 类型检查/单测不需要 Electron 运行时二进制——跳过下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # 轻量插件构建（windows runner）。平台构建太贵不进 PR，但 Windows 特有
  # 问题（如 spawn .bin sh shim）只有真跑插件构建才暴露（#292–#294 三连红
  # 的教训）。build:plugins 不含 electron-vite，跳过 Electron 二进制下载。
  plugin-build:
    name: Plugin Build (windows)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # dsh-common 等插件 import @appilot-labs/appilot-core/headless 的 dist，
      # 必须先构建 core（与根 build 脚本顺序一致）。
      - run: npm run build:core && npm run build:plugins

